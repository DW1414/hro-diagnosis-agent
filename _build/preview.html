<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --ink:#061018; --card:rgba(12,22,34,.78); --line:rgba(232,197,132,.2);
  --gold:#e8c584; --gold2:#f6e2b8; --teal:#4ff0d2; --blue:#7eb3ff;
  --rose:#ff6b88; --amber:#ffc14a; --mint:#4ee3a0;
  --text:#f4f7ff; --muted:#9aabc4; --shadow:0 28px 80px rgba(0,0,0,.42);
  --r:22px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text)}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;min-height:100dvh;overflow-x:hidden;line-height:1.6}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(920px 520px at 8% -8%,rgba(232,197,132,.22),transparent 58%),
             radial-gradient(760px 480px at 108% 0%,rgba(79,240,210,.14),transparent 52%),
             radial-gradient(680px 420px at 70% 110%,rgba(126,179,255,.12),transparent 55%),
             linear-gradient(180deg,#061018,#0a1624 55%,#071018)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.26;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:52px 52px}
.orb{position:fixed;z-index:0;pointer-events:none;filter:blur(40px);opacity:.42;animation:fl 12s ease-in-out infinite}
.orb.a{width:220px;height:220px;left:-40px;top:18%;background:#e8c584}
.orb.b{width:180px;height:180px;right:-30px;top:48%;background:#4ff0d2;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-18px) scale(1.06)}}
.app{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:calc(16px + var(--st)) 16px calc(120px + var(--sb))}
@media(min-width:980px){.app{padding-bottom:calc(40px + var(--sb))}}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:20px;font-weight:700;color:#1b2430;
  background:linear-gradient(140deg,var(--gold2),var(--gold));box-shadow:0 10px 26px rgba(232,197,132,.3)}
h1{margin:0;font-size:18px;letter-spacing:.4px}
.sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-size:12.5px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--gold2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on i{background:var(--teal);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.tips{font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px;margin-bottom:14px}
.journey{margin-bottom:14px}
.journey .now{font-size:13px;color:var(--gold2);margin-bottom:7px}
.rail{display:flex;gap:5px}
.rail i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.09);transition:.4s}
.rail i.done{background:linear-gradient(90deg,var(--gold),var(--teal))}
.rail i.act{background:var(--amber);animation:pulse 1s infinite}
.rail-names{display:flex;gap:5px;margin-top:5px}
.rail-names span{flex:1;font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layout{display:grid;gap:14px}
@media(min-width:980px){.layout{grid-template-columns:1.05fr .95fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .n{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:0}
.card h2 .sp{margin-left:auto}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--text);border-radius:12px;padding:9px 11px;font-size:13.5px;font-family:inherit;outline:none}
.field input:focus,.field select:focus,textarea:focus{border-color:var(--gold);background:rgba(232,197,132,.07)}
select option{background:#0d1725}
textarea{min-height:150px;resize:vertical;line-height:1.75}
@media(min-width:980px){textarea{min-height:190px}}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--teal);margin-top:8px;min-height:20px}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1s infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;transition:.2s}
.chip:hover{color:var(--gold2);border-color:var(--gold)}
.hold-wrap{display:flex;align-items:center;gap:12px;margin-top:12px}
.hold-btn{position:relative;flex:none;width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;color:#1b2430;
  font-weight:700;font-size:13px;background:linear-gradient(140deg,var(--gold2),var(--gold));
  box-shadow:0 12px 30px rgba(232,197,132,.34);display:grid;place-items:center;transition:.2s}
.hold-btn.rec{background:linear-gradient(140deg,#ff8fa3,var(--rose));animation:ring 1.4s infinite}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(255,107,136,0)}100%{box-shadow:0 0 0 0 rgba(255,107,136,0)}}
.hold-tip{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;
  padding:9px 15px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.teal{background:linear-gradient(140deg,rgba(79,240,210,.2),rgba(79,240,210,.08));border-color:rgba(79,240,210,.45);color:#bff7ec}
.btn.gold{background:linear-gradient(140deg,var(--gold2),var(--gold));color:#1b2430;border-color:transparent;font-weight:600}
.btn.sm{padding:6px 11px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{font-size:11.5px;color:var(--muted);margin:10px 0 0}
.fold{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.fold>summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸ ";color:var(--gold)}
.fold[open]>summary::before{content:"▾ "}
.kpi{display:grid;gap:7px;margin-top:10px}
.kpi .row{display:grid;grid-template-columns:1fr 78px 78px 62px;gap:8px;align-items:center;font-size:12.5px}
@media(max-width:640px){.kpi .row{grid-template-columns:1fr 62px 62px 54px;gap:5px;font-size:11.5px}}
.kpi .row .nm{color:var(--gold2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.kpi input{padding:6px 8px;font-size:12.5px;border-radius:9px}
.kpi .na{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.kpi .na input{width:auto}
.proc{max-height:none;font-size:13px}
@media(min-width:980px){.proc{max-height:660px;overflow:auto}}
.idle-art{color:var(--muted);font-size:12.5px;border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center}
.plog{display:grid;gap:6px;margin-top:4px}
.pitem{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 10px;border-radius:10px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.pitem .k{flex:none;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(232,197,132,.16);color:var(--gold2)}
.pitem.ok .k{background:rgba(78,227,160,.16);color:var(--mint)}
.pitem.warn .k{background:rgba(255,193,74,.16);color:var(--amber)}
.pitem.bad .k{background:rgba(255,107,136,.16);color:var(--rose)}
.pitem .v{color:#dfe7f5;min-width:0;word-break:break-word}
.report{margin-top:14px}
.rtbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.doc{border-radius:16px;background:#f7f3ea;color:#1b2430;padding:0;overflow:hidden}
.doc-in{padding:24px}
@media(max-width:640px){.doc-in{padding:16px}}
.doc h3{margin:0 0 4px;font-size:17px;color:#111a24}
.doc .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid #1b2430;padding-bottom:10px;margin-bottom:14px}
.doc .rh .who{font-size:12.5px;color:#5a6875;line-height:1.7}
.sec{margin:18px 0 0}
.sec>h4{margin:0 0 8px;font-size:13.5px;color:#0f1720;border-left:4px solid #b98f3f;padding-left:9px;line-height:1.3}
table{width:100%;border-collapse:collapse;font-size:12.3px;background:#fffdf7}
th,td{border:1px solid #ddd4c0;padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f0e9da;font-weight:600;color:#3a4653}
td.id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;white-space:nowrap;color:#7a5f22}
td.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.na td{color:#8b96a3;background:#f6f3ec}
tr.tbd td{background:#fdf6e8}
.tag{font-size:10.5px;padding:2px 7px;border-radius:99px;background:#f0e9da;color:#6d5a2c;border:1px solid #ddd4c0}
.tag.p{background:#b98f3f;color:#fff;border-color:#b98f3f}
.tag.g{background:#e6f8ef;color:#12805a;border-color:#a9e3c8}
.tag.r{background:#ffe9ee;color:#c8284a;border-color:#f5b9c7}
.tag.b{background:#eef3f8;color:#3f5f7f;border-color:#d6e2ec}
.totalbox{margin-top:10px;border:1px solid #b98f3f;background:#fffdf7;border-radius:12px;padding:12px}
.totalbox .big{font-size:22px;font-weight:700;color:#1b2430;font-variant-numeric:tabular-nums}
.totalbox .fm{font-size:12px;color:#5a6875;margin-top:4px;font-family:ui-monospace,Consolas,monospace}
.actcard{border:1px solid #ddd4c0;border-radius:12px;background:#fffdf7;padding:12px;margin-top:9px}
.actcard.pri{border-color:#b98f3f}
.actcard .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.actcard .t{font-weight:700;font-size:13.5px;color:#111a24}
.actcard dl{margin:0;display:grid;grid-template-columns:74px 1fr;gap:5px 10px;font-size:12.3px}
.actcard dt{color:#7a6a4e;font-weight:600}
.actcard dd{margin:0;color:#243040;line-height:1.65}
.warnbox{border-left:4px solid #d79a3c;background:#fff8ec;padding:9px 12px;border-radius:0 10px 10px 0;font-size:12.3px;margin-top:8px;color:#6b4e14}
.warnbox b{color:#9a6512}
.srcbox{font-size:11.5px;color:#7a8593;border-top:1px dashed #ddd4c0;margin-top:16px;padding-top:10px;line-height:1.8}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:8px;align-items:center;justify-content:center;
  padding:10px 14px calc(10px + var(--sb));background:rgba(8,16,26,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
@media(min-width:980px){.dock{display:none}}
.dock .hold-btn{width:60px;height:60px;font-size:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);z-index:40;opacity:0;
  background:rgba(8,16,26,.96);border:1px solid var(--line);color:var(--gold2);padding:10px 18px;border-radius:12px;
  font-size:13px;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(3,8,14,.72);backdrop-filter:blur(6px);padding:0}
.modal.on{display:block}
.mbox{position:absolute;inset:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:0}
@media(min-width:900px){.modal{padding:24px}.mbox{position:relative;inset:auto;max-width:1180px;margin:0 auto;border-radius:var(--r);max-height:92vh}}
.mhead{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,22,34,.96);z-index:2;flex-wrap:wrap}
.mhead h3{margin:0;font-size:15px;color:var(--gold2)}
.mbody{padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font-size:12.5px;padding:7px 13px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer}
.tab.on{background:rgba(232,197,132,.16);color:var(--gold2);border-color:var(--gold)}
.atbl{width:100%;border-collapse:collapse;font-size:12px;background:rgba(255,255,255,.03)}
.atbl th,.atbl td{border:1px solid rgba(232,197,132,.16);padding:6px 8px;text-align:left;vertical-align:top;color:var(--text)}
.atbl th{background:rgba(232,197,132,.1);color:var(--gold2);font-weight:500;white-space:nowrap}
.atbl input,.atbl select,.atbl textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  color:var(--text);border-radius:7px;padding:4px 6px;font-size:11.5px;font-family:inherit}
.atbl textarea{min-height:44px;resize:vertical;line-height:1.5}
.atbl select option{background:#0d1725}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
.wrapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin:8px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px;font-size:12.5px;align-items:center}
.kv input,.kv select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:7px 9px;font-size:12.5px;font-family:inherit}
.kv select option{background:#0d1725}
@media print{
  body::before,body::after,.orb,.dock,.toast,.modal,.rtbar,.journey,.layout,header.top,.tips,.proc{display:none!important}
  .app{padding:0;max-width:none}
  .report{margin:0;border:none;box-shadow:none;background:none;padding:0}
  .doc{background:#fff}
  .doc-in{padding:0 0 12px}
  .sec,.actcard,table{break-inside:avoid}
}
</style></head><body style="background:#061018;padding:20px"><div style="max-width:1100px;margin:0 auto"></div></body></html>
